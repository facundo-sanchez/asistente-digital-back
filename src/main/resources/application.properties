#quarkus.rest.path=/mi-balance-api
# Aplica a todo el servidor HTTP
quarkus.jackson.timezone=America/Argentina/Buenos_Aires
quarkus.core.sys-props."user.timezone"=America/Argentina/Buenos_Aires

quarkus.http.root-path=/asistente-digital-back/api/v1
quarkus.http.port=8080
# Mostrar Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
# Documentación OpenAPI
quarkus.smallrye-openapi.path=/openapi
# Configuración de Seguridad para OpenAPI / Swagger UI
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=JWT Auth
quarkus.smallrye-openapi.security-scheme-description=Ingrese el token JWT obtenido del endpoint /api/auth/login

# Conexión a PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/
quarkus.console.color=true
# Habilitar Hibernate ORM
#quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
# Habilitar CORS
# Permitir orígenes (podés especificar tu IP o '*' para desarrollo)
quarkus.http.cors.origins=*

# Métodos HTTP permitidos
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Headers permitidos
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with

# Autenticacion JWT
mp.jwt.verify.issuer=http://localhost:8080
# Clave pública para verificar tokens
mp.jwt.verify.publickey.location=publicKey.pem
# Clave privada para firmar tokens (revisa el nombre de la propiedad)
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.path.key-id=jwt-key

# Google OAuth2 Client ID
#google.client.id=${GOOGLE_CLIENT_ID:tu-google-client-id.apps.googleusercontent.com}
# BCRYPT
quarkus.elytron.security.bcrypt.strength=12

# API Key de Google AI Studio
quarkus.langchain4j.ai.gemini.api-key=

# ID del modelo (propiedad exacta: model-id)
quarkus.langchain4j.ai.gemini.chat-model.model-id=""
quarkus.langchain4j.ai.gemini.base-url=""
# Parámetros adicionales
quarkus.langchain4j.ai.gemini.chat-model.temperature=0.1
quarkus.langchain4j.ai.gemini.log-requests=true
quarkus.langchain4j.ai.gemini.log-responses=true
