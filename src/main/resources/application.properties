# =====================================================================
# Asistente de Vida Digital - backend
# Los valores sensibles se leen de variables de entorno; los defaults son
# solo para desarrollo local.
# =====================================================================

# ---------- Zona horaria ----------
quarkus.jackson.timezone=America/Argentina/Buenos_Aires
quarkus.core.sys-props."user.timezone"=America/Argentina/Buenos_Aires

# ---------- HTTP ----------
quarkus.http.root-path=/asistente-digital-back/api/v1
quarkus.http.port=${PORT:8080}
# Sin CORS: el navegador no llama al backend directamente; lo hace el BFF de Next.js.

# ---------- OpenAPI / Swagger ----------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=JWT Auth
quarkus.smallrye-openapi.security-scheme-description=Access token obtenido en POST /auth/login

# ---------- Base de datos ----------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/asistente_digital}

# Flyway aplica db/migration al iniciar. Hibernate no toca el esquema.
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none
%dev.quarkus.hibernate-orm.log.sql=true
# Columnas JSONB: Hibernate usa su propio serializador, no el ObjectMapper de REST
quarkus.hibernate-orm.mapping.format.global=ignore

quarkus.console.color=true

# ---------- JWT (SmallRye) ----------
# Access token RS256 firmado por este backend. Las claves NO van en el repo
# (*.pem esta en .gitignore). Desarrollo: generarlas en src/main/resources (ver .env.example).
# Produccion: JWT_PRIVATE_KEY_LOCATION / JWT_PUBLIC_KEY_LOCATION apuntan a archivos montados
# como secretos (ej. file:/run/secrets/jwt-private.pem). Sin default: si faltan, no arranca.
mp.jwt.verify.issuer=${JWT_ISSUER:asistente-digital}
mp.jwt.verify.audiences=asistente-digital-api
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:privateKey.pem}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

# ---------- Autenticacion (app) ----------
app.auth.issuer=${JWT_ISSUER:asistente-digital}
app.auth.audience=asistente-digital-api
app.auth.access-token-ttl=PT15M
app.auth.refresh-token-ttl=P30D
app.auth.email-verification-ttl=P2D
app.auth.password-reset-ttl=PT1H
# URL del frontend, para armar los links de los emails
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Costo de bcrypt (2^n iteraciones)
app.auth.bcrypt-cost=12

# ---------- Login con Google ----------
# Credenciales OAuth de Google Cloud (cliente "Aplicación web"). Sin ellas el login con
# Google responde 503. URI de redirección autorizada en Google Cloud:
#   FRONTEND_URL + /api/auth/google/callback
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ---------- Documentos ----------
# Carpeta donde se guardan los archivos subidos (en produccion, un volumen persistente)
app.documents.dir=${DOCUMENTS_DIR:./data/documentos}
app.documents.max-size=10485760
# El limite del cuerpo HTTP deja margen al archivo de 10 MB mas los campos del formulario
quarkus.http.limits.max-body-size=11M

# ---------- Emails ----------
# EMAIL_DELIVERY=log  -> se escriben en el log (default, solo desarrollo)
# EMAIL_DELIVERY=smtp -> se envian por el servidor SMTP configurado abajo
#   Desarrollo: Mailpit -> SMTP_HOST=localhost, SMTP_PORT=1025 (bandeja en http://localhost:8025)
#   Produccion: Gmail   -> SMTP_HOST=smtp.gmail.com, SMTP_PORT=587, SMTP_START_TLS=REQUIRED,
#                          SMTP_USER=cuenta@gmail.com, SMTP_PASSWORD=<contrasena de aplicacion>,
#                          SMTP_FROM=cuenta@gmail.com
app.email.delivery=${EMAIL_DELIVERY:log}
# En produccion nunca al log: los enlaces llevan tokens de un solo uso
%prod.app.email.delivery=${EMAIL_DELIVERY:smtp}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.from=${SMTP_FROM:Asistente Digital <no-reply@asistente-digital.local>}
# OPTIONAL: usa TLS si el servidor lo ofrece (Mailpit no lo ofrece). En produccion, REQUIRED.
quarkus.mailer.start-tls=${SMTP_START_TLS:OPTIONAL}
# Quarkus simula el envio en dev y test por defecto; aca decide app.email.delivery
quarkus.mailer.mock=false

# ---------- IA (Gemini) ----------
quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY:}
quarkus.langchain4j.ai.gemini.chat-model.model-id=${GEMINI_MODEL:gemini-3.5-flash-lite}
quarkus.langchain4j.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
quarkus.langchain4j.ai.gemini.timeout=${GEMINI_TIMEOUT:60s}
quarkus.langchain4j.ai.gemini.chat-model.temperature=0.1
# Los pedidos llevan documentos con datos personales: no se registran salvo que se pida (RN-007)
quarkus.langchain4j.ai.gemini.log-requests=${GEMINI_LOG:false}
quarkus.langchain4j.ai.gemini.log-responses=${GEMINI_LOG:false}
